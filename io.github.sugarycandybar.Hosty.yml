app-id: io.github.sugarycandybar.Hosty
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: hosty
separate-locales: false
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - python3-requirements.json
  - name: hosty
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/sugarycandybar/Hosty.git
        commit: 37a26e6872506adec99ee2a1615ebd75e4fb088b
