app-id: io.github.sugarycandybar.Hosty
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: hosty
separate-locales: false
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - python3-requirements.json
  - name: hosty
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/sugarycandybar/Hosty.git
        commit: 595eb755fc5d4b259093ce6dd57c36371f4776c0
